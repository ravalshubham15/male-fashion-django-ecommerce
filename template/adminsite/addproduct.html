{% extends "adminsite/dashboard.html" %}
{% load static %}

{% block mainContent %}

<div class="container">
    <div class="page-inner">

        <div class="page-header">
            <h3 class="fw-bold mb-3">
                <i class="fas fa-box-open text-primary"></i> Add Product
            </h3>
        </div>

        <div class="row">
            <div class="col-md-8 mx-auto">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white">
                        <h4 class="card-title mb-0">
                            Add New Product
                        </h4>
                    </div>

                    <div class="card-body">

                        <!-- Messages -->
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }}">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST" enctype="multipart/form-data">

                            {% csrf_token %}

                            <!-- Product Name -->

                            <div class="mb-3">
                                <label class="form-label">Product Name</label>

                                <input
                                    type="text"
                                    name="txtpname"
                                    class="form-control"
                                    placeholder="Enter Product Name"
                                    value="{{ name }}"
                                    required
                                >
                            </div>

                            <!-- Brand -->

                            <div class="mb-3">
                                <label class="form-label">Brand</label>

                                <select
                                    class="form-select"
                                    name="brand"
                                    onchange="this.form.submit()"
                                    required
                                >

                                    <option value="">
                                        Select Brand
                                    </option>

                                    {% for d in brands %}

                                    <option
                                        value="{{ d.id }}"
                                        {% if d.id|stringformat:"s" == selected_brand_id %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ d.name }}
                                    </option>

                                    {% endfor %}

                                </select>
                            </div>

                            <!-- Category -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Category
                                </label>

                                <select
                                    class="form-select"
                                    name="category"
                                    required
                                >

                                    <option value="">
                                        Select Category
                                    </option>

                                    {% for c in categories %}

                                    <option
                                        value="{{ c.id }}"
                                        {% if c.id|stringformat:"s" == selected_category_id %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ c.name }}
                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                            <!-- Price -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Price
                                </label>

                                <input
                                    type="number"
                                    step="0.01"
                                    name="txtprice"
                                    class="form-control"
                                    placeholder="Enter Price"
                                    value="{{ price }}"
                                    required
                                >

                            </div>

                            <!-- Stock -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Stock
                                </label>

                                <input
                                    type="number"
                                    name="txtstock"
                                    class="form-control"
                                    placeholder="Enter Stock"
                                    value="{{ stock }}"
                                    required
                                >

                            </div>

                            <!-- Description -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Description
                                </label>

                                <textarea
                                    class="form-control"
                                    rows="5"
                                    name="txtdescription"
                                    required
                                >{{ description }}</textarea>

                            </div>

                            <!-- Image -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Product Image
                                </label>

                                <input
                                    type="file"
                                    class="form-control"
                                    name="txtimage"
                                    id="imageInput"
                                    accept="image/*"
                                    required
                                >

                            </div>

                            <!-- Preview -->

                            <div class="mb-3 text-center">

                                <img
                                    id="preview"
                                    src=""
                                    style="display:none; max-height:200px;"
                                    class="img-thumbnail"
                                >

                            </div>

                            <!-- Buttons -->

                            <div class="text-center">

                                <button
                                    type="submit"
                                    class="btn btn-success"
                                >
                                    <i class="fas fa-save"></i>
                                    Save Product
                                </button>

                                <a
                                    href="{% url 'manageproduct' %}"
                                    class="btn btn-danger"
                                >
                                    Cancel
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

<script>

document.getElementById("imageInput").onchange=function(e){

    const reader=new FileReader();

    reader.onload=function(){

        document.getElementById("preview").src=reader.result;
        document.getElementById("preview").style.display="block";

    }

    reader.readAsDataURL(e.target.files[0]);

}

</script>

{% endblock %}
