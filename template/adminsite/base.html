{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>SR Clothing Admin</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="{% static 'assets/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Kaiadmin -->
    <link href="{% static 'assets/css/kaiadmin.min.css' %}" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="{% static 'assets/css/plugins.min.css' %}" rel="stylesheet">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <div class="sidebar" data-background-color="dark">

        <div class="sidebar-logo">

            <div class="logo-header" data-background-color="dark">

                <a href="{% url 'admin_dashboard' %}" class="logo">

                    <img src="{% static 'img/admin_logo.png' %}"alt="SR Clothing Logo"
                    style="height:45px;">

                </a>

                <button class="btn btn-toggle toggle-sidebar">
                    <i class="gg-menu-right"></i>
                </button>

            </div>

        </div>

        <div class="sidebar-wrapper scrollbar scrollbar-inner">

            <div class="sidebar-content">

                <ul class="nav nav-secondary">
                  
                  <li class="nav-item active">
    <a href="{% url 'admin_dashboard' %}">
        <i class="fas fa-home"></i>
        <p>Dashboard</p>
    </a>
</li>

<li class="nav-section">
    <h4 class="text-section">Management</h4>
</li>

<li class="nav-item">
    <a href="{% url 'manageuser' %}">
        <i class="fas fa-users"></i>
        <p>Users</p>
    </a>
</li>

<li class="nav-item">
    <a href="{% url 'managebrand' %}">
        <i class="fas fa-tags"></i>
        <p>Brands</p>
    </a>
</li>

<li class="nav-item">
    <a href="{% url 'managecategory' %}">
        <i class="fas fa-list"></i>
        <p>Categories</p>
    </a>
</li>

<li class="nav-item">
    <a href="{% url 'manageproduct' %}">
        <i class="fas fa-box"></i>
        <p>Products</p>
    </a>
</li>

<li class="nav-section">
    <h4 class="text-section">Business</h4>
</li>

<li class="nav-item">
    <a href="{% url 'manageorder' %}">
        <i class="fas fa-shopping-cart"></i>
        <p>Orders</p>
    </a>
</li>

<li class="nav-item">
    <a href="{% url 'managepayment' %}">
        <i class="fas fa-money-check-alt"></i>
        <p>Payments</p>
    </a>
</li>

<li class="nav-item">
    <a href="{% url 'managereview' %}">
        <i class="fas fa-star"></i>
        <p>Reviews</p>
    </a>
</li>

<li class="nav-item">
    <a href="{% url 'reports' %}">
        <i class="fas fa-chart-line"></i>
        <p>Reports</p>
    </a>
</li>

<li class="nav-item">
    <a href="{% url 'logout' %}">
        <i class="fas fa-sign-out-alt"></i>
        <p>Logout</p>
    </a>
</li>

</ul>

</div>

</div>

</div>

<!-- Main Panel -->

<div class="main-panel">
  <div class="main-header">

    <nav class="navbar navbar-header navbar-expand-lg border-bottom">

        <div class="container-fluid">

            <!-- Search -->

            <form class="navbar-form nav-search d-none d-lg-flex">

                <div class="input-group">

                    <input
                        type="text"
                        placeholder="Search..."
                        class="form-control"
                    >

                   <button class="btn btn-search" type="submit">
                        <i class="fa fa-search"></i>
                    </button>

                </div>

            </form>

            <ul class="navbar-nav ms-auto align-items-center">

                <!-- Admin -->

                <li class="nav-item dropdown">

                    <a
                        class="dropdown-toggle profile-pic"
                        data-bs-toggle="dropdown"
                        href="#"
                    >

                        <div class="avatar-sm">

                            <img
                                src="{% static 'img/admin_logo.png' %}"
                                class="avatar-img rounded-circle"
                            >

                        </div>

                        <span class="profile-username">

                            <span class="fw-bold">
                                {{ request.user.username }}
                            </span>

                        </span>

                    </a>

                    <ul class="dropdown-menu dropdown-user">

                        <li>

                            <a class="dropdown-item"
                               href="{% url 'logout' %}">

                                <i class="fas fa-sign-out-alt"></i>

                                Logout

                            </a>

                        </li>

                    </ul>

                </li>

            </ul>

        </div>

    </nav>

</div>

<div class="container">

    <div class="page-inner">

        {% block mainContent %}

        {% endblock %}

    </div>
</div>

<script src="{% static 'assets/js/core/jquery-3.7.1.min.js' %}"></script>
<script src="{% static 'assets/js/core/popper.min.js' %}"></script>
<script src="{% static 'assets/js/core/bootstrap.min.js' %}"></script>

<!-- Scrollbar -->
<script src="{% static 'assets/js/plugin/jquery-scrollbar/jquery.scrollbar.min.js' %}"></script>

<!-- DataTables -->
<script src="{% static 'assets/js/plugin/datatables/datatables.min.js' %}"></script>

<!-- SweetAlert -->
<script src="{% static 'assets/js/plugin/sweetalert/sweetalert.min.js' %}"></script>

<!-- Kaiadmin -->
<script src="{% static 'assets/js/kaiadmin.min.js' %}"></script>

</body>
</html>
