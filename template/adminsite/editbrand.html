{% extends "adminsite/dashboard.html" %}
{% block mainContent %}

<div class="container">
          <div class="page-inner">
            <div class="page-header">
              <h3 class="fw-bold mb-3">Brand :-</h3>
            </div>
            <form  method="POST" enctype="multipart/form-data">
              {% csrf_token %}
            <div class="row">
              <div class="col-md-12">
                <div class="card">
                  <div class="card-header">
                    <div class="card-title">Edit Brand</div>
                  </div>

                  <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 col-lg-8">
                        <div class="form-group">
                          <label for=""> Brand Name :</label>
                          <input
                            type="text"
                            class="form-control"
                            id=""
                            placeholder="Enter Name"
                            name="txtbname"
                            value="{{data.name}}"
                          />
                        </div>
                        
                        <div class="form-group">
                          <label for="comment">Description</label>
                         <textarea class="form-control" id="comment" name="txtdescription"
                         rows="5">{{ data.description }}</textarea>
                          
                        </div>

                         <div class="form-group">
                          <label for="exampleFormControlFile1"
                            >Example file input</label
                          >
                          <input
                            type="file"
                            class="form-control-file"
                            id="exampleFormControlFile1"
                            name="txtimage"
                            
                          />
                        </div>
                        
                        {% if data.image %}
        <div class="mt-3">
        <img src="{{ data.image.url }}"
             width="120"
             class="img-thumbnail">
        </div>
                        {% endif %}
                        

                       
              </div>

                    <div class="card-action">
                    <button class="btn btn-success">Submit</button>
                    <button type="button" class="btn btn-danger">
                                    Cancel
                    </button>
                    </div>
                     </form>
            </div>
            </div>
             
        </div>
          </div>
</div>

        {% endblock mainContent %}
