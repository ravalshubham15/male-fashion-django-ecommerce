{% extends "adminsite/dashboard.html" %}
{% block mainContent %}

<div class="container">
    <div class="page-inner">

        <div class="row">
            <div class="col-md-8">

                <div class="card">

                    <div class="card-header">
                        <div class="card-title">
                            Edit Product
                        </div>
                    </div>

                    <div class="card-body">

                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}

                            <!-- Product Name -->
                            <div class="form-group">
                                <label>Product Name</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    name="txtpname"
                                    value="{{ product.name }}"
                                    required
                                >
                            </div>

                            <!-- Brand -->
                            <div class="form-group">
                                <label>Select Brand</label>

                                <select
                                    class="form-select"
                                    name="brand"
                                    required
                                >

                                    {% for b in brands %}

                                    <option
                                        value="{{ b.id }}"
                                        {% if b.id == product.brand.id %}selected{% endif %}
                                    >
                                        {{ b.name }}
                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                            <!-- Category -->
                            <div class="form-group">
                                <label>Select Category</label>

                                <select
                                    class="form-select"
                                    name="category"
                                    required
                                >

                                    {% for c in categories %}

                                    <option
                                        value="{{ c.id }}"
                                        {% if c.id == product.category.id %}selected{% endif %}
                                    >
                                        {{ c.name }}
                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                            <!-- Price -->
                            <div class="form-group">
                                <label>Price</label>

                                <input
                                    type="number"
                                    step="0.01"
                                    class="form-control"
                                    name="txtprice"
                                    value="{{ product.price }}"
                                    required
                                >

                            </div>

                            <!-- Description -->
                            <div class="form-group">

                                <label>Description</label>

                                <textarea
                                    class="form-control"
                                    name="txtdescription"
                                    rows="5"
                                    required
                                >{{ product.description }}</textarea>

                            </div>

                            <!-- Stock -->
                            <div class="form-group">

                                <label>Stock</label>

                                <input
                                    type="number"
                                    class="form-control"
                                    name="txtstock"
                                    value="{{ product.stock }}"
                                    required
                                >

                            </div>

                            <!-- Current Image -->
                            <div class="form-group">

                                <label>Current Image</label><br>

                                {% if product.image %}

                                <img
                                    src="{{ product.image.url }}"
                                    width="150"
                                    class="img-thumbnail mb-3"
                                >

                                {% else %}

                                <p class="text-danger">
                                    No Image Available
                                </p>

                                {% endif %}

                            </div>

                            <!-- Upload New Image -->
                            <div class="form-group">

                                <label>Change Image</label>

                                <input
                                    type="file"
                                    class="form-control"
                                    name="txtimage"
                                >

                            </div>

                            <br>

                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                <i class="fa fa-save"></i>
                                Update Product
                            </button>

                            <a
                                href="{% url 'manageproduct' %}"
                                class="btn btn-danger"
                            >
                                Cancel
                            </a>

                        </form>

                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
