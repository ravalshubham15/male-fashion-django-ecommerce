{% extends "adminsite/dashboard.html" %}
{% block mainContent %}
<div class="container">
          <div class="page-inner">
            <div class="page-header">
              <h3 class="fw-bold mb-3">User Form :-</h3>
            </div>

            <div class="row">
              <div class="col-md-12">
                <div class="card">
                  <div class="card-header">
                    <div class="card-title">Edit User</div>
                  </div>

                  <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 col-lg-8">
                        <div class="form-group">
                          <label for="">Name :</label>
                          <input
                            type="text"
                            class="form-control"
                            id=""
                            placeholder="Enter Name"
                            value="{{data.name}}"
                          />
                        </div>
                        
                        <div class="form-group">
                          <label for="">Username :</label>
                          <input
                            type="text"
                            class="form-control"
                            id=""
                            placeholder="Enter Username"
                            value="{{data.username}}"
                            disabled
                          />
                        </div>

                        <div class="form-group">
                          <label for="">Email :</label>
                          <input
                            type="email"
                            class="form-control"
                            id=""
                            placeholder="Enter Email"
                            value="{{data.email}}"
                            
                          />
                        </div>

                        <div class="form-group">
                          <label for="">Password :</label>
                          <input
                            type="password"
                            class="form-control"
                            id=""
                            placeholder="Enter Password"
                            value="{{data.password}}"
                            disabled
                          />
                        </div>

                        <div class="form-group">
                          <label for="email2">Contact :</label>
                          <input
                            type="text"
                            class="form-control"
                            id=""
                            placeholder="Enter Contact"
                            value="{{data.contact}}"
                          />
                        </div>

                        <div class="form-group">
                          <label for="email2">City :</label>
                          <input
                            type="text"
                            class="form-control"
                            id=""
                            placeholder="Enter City"
                            value="{{data.city}}""
                          />
                        </div>
              </div>

                    <div class="card-action">
                    <button class="btn btn-success">Submit</button>
                    <button class="btn btn-danger">Cancel</button>
                    </div>
                    
            </div>
              </div>

            </div>
          </div>
        </div>
        </div>
</div>
        {% endblock mainContent %}
