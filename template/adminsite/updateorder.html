{% extends 'adminsite/base.html' %}

{% block mainContent %}

<div class="container mt-4">

    <div class="card">

        <div class="card-header">
            <h3>Update Order Status</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Order Status
                    </label>

                    <select name="status" class="form-control">

                        {% for value,label in status_choices %}

                        <option value="{{ value }}"
                        {% if order.status == value %}selected{% endif %}>
                            {{ label }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <button class="btn btn-success">
                    Update Status
                </button>

                <a href="{% url 'manageorder' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
